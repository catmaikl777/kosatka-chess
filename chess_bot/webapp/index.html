<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Косатка · шахматы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#4a2f1c;
  --bg-2:#35210f;
  --panel:#5d3c22;
  --panel-2:#744b2b;
  --text:#f7e9d2;
  --dim:#d3b48c;
  --accent:#e3a95a;
  --accent-2:#9ecf9a;
  --light:#f0d9b2;
  --dark:#98643e;
  --ok:#9ecf9a;
  --bad:#ff9d84;
  --radius:18px;
  --wood-grain:rgba(52,30,14,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--text);
  background:
    repeating-linear-gradient(90deg, var(--wood-grain) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(0deg, rgba(255,235,200,.05) 0 1px, transparent 1px 7px),
    linear-gradient(160deg, #6b452a, var(--bg) 45%, var(--bg-2));
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
.app{max-width:560px;margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}

header.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat{width:44px;height:44px;flex:none}
.title{font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.subtitle{font-size:12.5px;color:var(--dim);margin-top:2px}
.moods{margin-left:auto;font-size:12px;color:var(--accent);text-align:right;max-width:44%;line-height:1.25}

.boardWrap{position:relative;border-radius:var(--radius);padding:8px;
  background:linear-gradient(150deg,#7a4f2d,#5b391f 60%,#4a2e18);
  box-shadow:0 12px 34px rgba(20,10,4,.5), inset 0 0 0 1px rgba(255,214,160,.16)}
svg.board{display:block;width:100%;height:auto;border-radius:12px;touch-action:manipulation}
svg.board .sq{cursor:default}
svg.board.playable .sq.hasPiece{cursor:pointer}
svg.board .sq.last{fill:rgba(232,155,74,.34)}
svg.board .sq.sel{fill:rgba(232,155,74,.45)}
svg.board .sq.checked{fill:rgba(255,90,90,.45)}
svg.board .sq.hint{fill:rgba(126,214,176,.45)}
svg.board .sq.dest{cursor:pointer}
svg.board .dot{fill:rgba(30,30,40,.42);pointer-events:none}
svg.board .ring{fill:none;stroke:rgba(232,155,74,.85);stroke-width:6;pointer-events:none}
svg.board .arrow{stroke:rgba(232,155,74,.85);stroke-width:5;stroke-linecap:round;fill:none;pointer-events:none}
svg.board .piece{pointer-events:none}
svg.board .piece image{image-rendering:pixelated;pointer-events:none}
svg.board .boardArt{image-rendering:pixelated;pointer-events:none}
svg.board .piece.animate{will-change:transform}
svg.board .marks{pointer-events:none}
svg.board .lastmark{fill:rgba(245,205,120,.32);stroke:rgba(255,222,150,.75);stroke-width:2.5;transition:none}
svg.board .checkmark{fill:rgba(226,90,74,.42);stroke:rgba(255,150,130,.85);stroke-width:3}
svg.board .capdot{fill:rgba(40,22,12,.55);pointer-events:none;animation:capPulse 1.4s ease-in-out infinite}
svg.board .ring{stroke-dasharray:14 8;animation:ringSpin 6s linear infinite;transform-origin:center}
svg.board .sq.dest:hover{filter:brightness(1.12)}
svg.board .coord{font-size:15px;font-weight:700;fill:rgba(255,236,208,.55);pointer-events:none;
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@keyframes capPulse{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes ringSpin{to{stroke-dashoffset:-88}}
@keyframes piecePop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
svg.board .piece.spawn{animation:piecePop 240ms ease-out}
.soundToggle{width:38px;padding:0;display:grid;place-items:center;font-size:16px}

.overlay{position:absolute;inset:8px;border-radius:12px;display:none;place-items:center;text-align:center;
  background:rgba(20,16,28,.78);backdrop-filter:blur(3px);padding:16px;z-index:3}
.overlay.show{display:grid}
.overlay h2{margin:0 0 6px;font-size:20px}
.overlay p{margin:0 0 14px;color:var(--dim);font-size:14px}

.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;
  background:var(--panel-2);color:var(--text);transition:transform .06s ease, background .15s}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--accent),#d9822f);color:#1a1210;font-weight:700}
button.ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
button.danger{background:#3a2530;color:#ffc2c2}
button:disabled{opacity:.45;cursor:default}
.bar .grow{flex:1}

.counter{font-size:13px;color:var(--dim);margin-top:8px;min-height:18px;text-align:center}

dialog{border:0;border-radius:20px;background:var(--panel);color:var(--text);padding:0;max-width:520px;width:calc(100% - 24px);
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(8,6,12,.66)}
.sheet{padding:18px}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--dim);font-size:13.5px}
.levels{display:grid;gap:8px;margin:10px 0 14px}
.level{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel-2);
  cursor:pointer;transition:box-shadow .15s, transform .08s}
.level:active{transform:scale(.985)}
.level[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.level .name{font-weight:700}
.level .desc{font-size:12px;color:var(--dim)}
.pick{display:flex;gap:8px}
.pick button{flex:1}
fieldset{border:0;padding:0;margin:0}
.msg{font-size:13px;color:var(--bad);min-height:18px;margin-top:6px}

.history{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--panel);font-size:13.5px;
  color:var(--dim);line-height:1.55;word-break:break-word}
.history b{color:var(--text)}
.material{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:#33283f;color:var(--text);padding:11px 16px;border-radius:14px;font-size:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.18s ease;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-bottom:10px}
.dotpulse{width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 0 rgba(126,214,176,.6);
  animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(126,214,176,0)}100%{box-shadow:0 0 0 0 rgba(126,214,176,0)}}

.toast *,button{user-select:none}
.app.hidden{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <svg class="cat" viewBox="0 0 100 100" aria-label="Косатка">
      <polygon points="16,40 22,14 44,30" fill="#0e0e14"/>
      <polygon points="84,40 78,14 56,30" fill="#0e0e14"/>
      <polygon points="20,36 24,19 36,29" fill="#7a4e56"/>
      <ellipse cx="50" cy="58" rx="40" ry="34" fill="#0e0e14"/>
      <ellipse cx="42" cy="72" rx="11" ry="11" fill="#f5f4f0"/>
      <ellipse cx="58" cy="72" rx="11" ry="11" fill="#f5f4f0"/>
      <ellipse cx="38" cy="52" rx="7" ry="8" fill="#7ed6b0"/>
      <ellipse cx="62" cy="52" rx="7" ry="8" fill="#7ed6b0"/>
      <ellipse cx="38" cy="53" rx="2" ry="6" fill="#0e0e14"/>
      <ellipse cx="62" cy="53" rx="2" ry="6" fill="#0e0e14"/>
      <rect x="33" y="55" width="10" height="2.6" rx="1.3" fill="#0e0e14"/>
      <rect x="57" y="55" width="10" height="2.6" rx="1.3" fill="#0e0e14"/>
      <polygon points="46,64 54,64 50,69" fill="#e89b4a"/>
      <path d="M42 72 q8 6 16 0" stroke="#f5f4f0" stroke-width="2" fill="none"/>
    </svg>
    <div>
      <div class="title" id="title">Косатка</div>
      <div class="subtitle" id="subtitle">выбирает партию…</div>
    </div>
    <div class="moods" id="mood"></div>
  </header>

  <div class="boardWrap" id="boardWrap">
    <svg class="board" id="board" viewBox="0 0 440 440" role="grid" aria-label="Шахматная доска"></svg>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="overlayTitle"></h2>
        <p id="overlayText"></p>
        <div class="bar" style="justify-content:center">
          <button class="primary" id="overlayAgain">Ещё партия</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="btnFlip" title="Повернуть доску">⤾</button>
    <button id="btnSound" class="soundToggle" title="Звук">🔊</button>
    <button id="btnTheme" title="Тема доски">🎨</button>
    <button id="btnDraw" class="ghost">Ничья</button>
    <button id="btnResign" class="danger">Сдаться</button>
  </div>
  <div class="counter" id="counter"></div>

  <div class="history" id="history">Косатка уже точит когти.</div>
</div>

<dialog id="dlgPromo">
  <div class="sheet">
    <h3>Превращение пешки</h3>
    <p>Косатка спрашивает: в кого превращать?</p>
    <div class="levels" id="promoPick"></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';

const TG = window.Telegram ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor('#18151f'); TG.setBackgroundColor('#18151f'); } catch (e) {} }

const API = (window.KOSATKA_API || '').replace(/\/+$/, '');
const POLL_MS = 1200;

const state = {
  gameId: null,
  game: null,
  perspective: 'w',
  selected: null,
  hint: false,
  pending: false,
  forceFlip: null,
  timer: null,
  name: (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.first_name) || 'Игрок',
  startParam: (TG && (TG.initDataUnsafe.start_param || TG.initDataUnsafe.startapp)) || new URLSearchParams(location.search).get('startapp') || '',
  isTelegram: Boolean(TG && TG.initData),
  theme: localStorage.getItem('kosatka_theme') === 'green' ? 'green' : 'wood',
  localMove: null,
  oppTimer: null,
};

const $ = (id) => document.getElementById(id);
const board = $('board');

/* Темы доски: PNG 176x176 с рамкой 8 px и клетками по 20 px. */
const THEMES = {
  wood: { title: 'Дерево', board: 'assets/board/board-01.png' },
  green: { title: 'Зелень', board: 'assets/board/board-02.png' },
};
const PIECE_FILE = { P: 'pawn', N: 'knight', B: 'bishop', R: 'rook', Q: 'queen', K: 'king' };

function pieceMarkup(p, cx, cy, size, flip, extra = '') {
  const file = PIECE_FILE[p[1].toUpperCase()] || 'pawn';
  const colour = p[0] === 'w' ? 'white' : 'black';
  return `<g class="piece ${extra}" data-piece="1" transform="translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 100})">`
    + `<image href="assets/pieces/${colour}/${file}.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>`
    + `</g>`;
}

/* ---------- звук (WebAudio, без файлов) ---------- */

const Sound = {
  ctx: null,
  enabled: localStorage.getItem('kosatka_sound') !== '0',
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, duration, { type = 'sine', gain = 0.12, at = 0, slide = 0 } = {}) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();
    const start = ctx.currentTime + at;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), start + duration);
    vol.gain.setValueAtTime(0.0001, start);
    vol.gain.exponentialRampToValueAtTime(gain, start + 0.012);
    vol.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(vol).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  },
  noise(duration = 0.09, gain = 0.16) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = ctx.createBufferSource();
    const vol = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400;
    vol.gain.value = gain;
    src.buffer = buffer;
    src.connect(filter).connect(vol).connect(ctx.destination);
    src.start();
  },
  move() { this.tone(320, 0.09, { type: 'triangle', gain: 0.11 }); this.noise(0.05, 0.05); },
  capture() { this.noise(0.14, 0.22); this.tone(150, 0.16, { type: 'square', gain: 0.05, slide: -60 }); },
  castle() { this.tone(420, 0.08, { type: 'triangle', gain: 0.1 }); this.tone(320, 0.1, { type: 'triangle', gain: 0.1, at: 0.1 }); },
  check() { this.tone(760, 0.1, { type: 'sine', gain: 0.14 }); this.tone(980, 0.16, { type: 'sine', gain: 0.14, at: 0.11 }); },
  win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.2, { gain: 0.1, at: i * 0.12 })); },
  lose() { [392, 330, 262].forEach((f, i) => this.tone(f, 0.24, { type: 'triangle', gain: 0.1, at: i * 0.14 })); },
  click() { this.tone(660, 0.04, { type: 'sine', gain: 0.05 }); },
  select() { this.tone(540, 0.05, { type: 'sine', gain: 0.06 }); },
};
/* ---------- сеть ---------- */

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TG && TG.initData) headers['X-Telegram-Init-Data'] = TG.initData;
  const res = await fetch(API + path, { ...options, headers });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const message = (data && (data.error || data.message)) || ('Ошибка ' + res.status);
    const err = new Error(message);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* ---------- отрисовка доски ---------- */

const FILES = 'abcdefgh';

function squareXY(square, size) {
  const file = square.charCodeAt(0) - 97;
  const rank = parseInt(square[1], 10) - 1;
  const col = state.perspective === 'w' ? file : 7 - file;
  const row = state.perspective === 'w' ? 7 - rank : rank;
  return [ORIGIN + col * size, ORIGIN + row * size];
}

function pieceAt(square) {
  const b = state.game && state.game.board;
  return b ? b[square] || null : null;
}

function legalMovesFrom(square) {
  const g = state.game;
  if (!g || !g.legal) return [];
  return g.legal.filter((m) => m.slice(0, 2) === square);
}

const BOARD_SIZE = 440;
const BOARD_ART = 176;             // размер исходной картинки доски
const BOARD_FRAME = 8;             // рамка на исходнике, px
const BOARD_SCALE = BOARD_SIZE / BOARD_ART;
const ORIGIN = BOARD_FRAME * BOARD_SCALE;   // 20 px — отступ клеток в SVG
const CELL = (BOARD_SIZE - ORIGIN * 2) / 8; // 50 px на клетку
const OPPONENT_DELAY = 1000;       // пауза перед ходом Косатки, мс

/* Анимация перемещения: старая позиция → новая, без мигания. */
function animateMove(move) {
  const g = state.game;
  if (!move || move.length < 4) return false;
  const from = move.slice(0, 2);
  const to = move.slice(2, 4);
  if (from === to) return false;
  const el = document.querySelector(`svg.board .piece[data-sq="${to}"]`);
  if (!el) return false;
  const [fx, fy] = squareXY(from, CELL);
  const [tx, ty] = squareXY(to, CELL);
  if (fx === tx && fy === ty) return false;
  // squareXY отдаёт левый верхний угол клетки, а фигура позиционируется от центра
  const [fcx, fcy] = [fx + CELL / 2, fy + CELL / 2];
  const [tcx, tcy] = [tx + CELL / 2, ty + CELL / 2];
  const size = CELL * 0.88;
  // Позиция фигуры живёт в атрибуте transform, поэтому CSS-переход её
  // перезаписывал и фигура прыгала в угол. Ведём атрибут по кадрам вручную.
  const place = (x, y) => `translate(${x} ${y}) scale(${size / 100})`;
  // сразу ставим фигуру в исходную клетку: иначе первый кадр мелькает на целевой
  el.setAttribute('transform', place(fcx - size / 2, fcy - size / 2));
  const started = performance.now();
  const duration = 190;
  const frame = (now) => {
    const k = Math.min(1, (now - started) / duration);
    const eased = 1 - Math.pow(1 - k, 3);
    el.setAttribute(
      'transform',
      place(fcx + (tcx - fcx) * eased - size / 2, fcy + (tcy - fcy) * eased - size / 2)
    );
    if (k < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  return true;
}

function renderBoard(spawnMode = false) {
  const g = state.game;
  if (!g) return;
  const S = BOARD_SIZE;
  const step = CELL;
  const myTurn = g.yourTurn && !state.pending;
  const checkedKing = findCheckedKing(g);
  const last = g.lastMove || '';
  const lastSquares = last ? [last.slice(0, 2), last.slice(2, 4)] : [];
  const targets = state.selected ? legalMovesFrom(state.selected) : [];

  const parts = [];
  parts.push(`<image class="boardArt" href="${THEMES[state.theme].board}" x="0" y="0" width="${S}" height="${S}" preserveAspectRatio="none"/>`);

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const file = state.perspective === 'w' ? col : 7 - col;
      const rank = state.perspective === 'w' ? 7 - row : row;
      const sq = FILES[file] + (rank + 1);
      const isLight = (file + rank) % 2 === 1;
      const classes = ['sq', isLight ? 'light' : 'dark'];
      if (pieceAt(sq)) classes.push('hasPiece');
      if (targets.some((m) => m.slice(2, 4) === sq)) classes.push('dest');
      parts.push(`<rect class="${classes.join(' ')}" data-sq="${sq}" x="${ORIGIN + col * step}" y="${ORIGIN + row * step}" width="${step}" height="${step}" fill="transparent"/>`);
    }
  }

  for (const sq of lastSquares) {
    const [x, y] = squareXY(sq, step);
    parts.push(`<rect class="lastmark" x="${x}" y="${y}" width="${step}" height="${step}" rx="3"/>`);
  }
  if (checkedKing) {
    const [x, y] = squareXY(checkedKing, step);
    parts.push(`<rect class="checkmark" x="${x + 2}" y="${y + 2}" width="${step - 4}" height="${step - 4}" rx="8"/>`);
  }

  for (const m of targets) {
    const [x, y] = squareXY(m.slice(2, 4), step);
    if (pieceAt(m.slice(2, 4))) {
      parts.push(`<rect class="ring" x="${x + 4}" y="${y + 4}" width="${step - 8}" height="${step - 8}" rx="10"/>`);
    } else {
      parts.push(`<circle class="capdot" cx="${x + step / 2}" cy="${y + step / 2}" r="${step * 0.14}"/>`);
    }
  }

  const flip = state.perspective === 'b';
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const file = state.perspective === 'w' ? col : 7 - col;
      const rank = state.perspective === 'w' ? 7 - row : row;
      const sq = FILES[file] + (rank + 1);
      const p = pieceAt(sq);
      if (!p) continue;
      const cx = col * step + step / 2;
      const cy = row * step + step / 2;
      const extra = (spawnMode && sq === extraSquare) ? 'spawn' : '';
      parts.push(pieceMarkup(p, cx, cy, step * 0.88, flip, extra).replace('data-piece="1"', `data-piece="1" data-sq="${sq}"`));
    }
  }

  // координаты в рамке вокруг доски
  const coordY = S - ORIGIN / 2 + 4;
  const coordX = S - ORIGIN / 2;
  for (let index = 0; index < 8; index++) {
    const letter = state.perspective === 'w' ? FILES[index] : FILES[7 - index];
    parts.push(`<text class="coord" x="${ORIGIN + index * step + step / 2}" y="${coordY}" text-anchor="middle">${letter}</text>`);
    const number = state.perspective === 'w' ? 8 - index : index + 1;
    parts.push(`<text class="coord" x="${coordX}" y="${ORIGIN + index * step + step / 2 + 4}" text-anchor="middle">${number}</text>`);
  }

  board.innerHTML = parts.join('');
  board.classList.toggle('playable', Boolean(myTurn));
  board.querySelectorAll('.sq').forEach((el) => {
    el.addEventListener('click', () => onSquare(el.dataset.sq));
  });
}

let extraSquare = null;
function findCheckedKing(g) {
  if (!g.isCheck || !g.checkSquare) return null;
  const sq = g.checkSquare;
  const persp = state.perspective === 'w' ? 0 : 7;
  const col = persp + (persp === 0 ? sq.charCodeAt(0) - 97 : 7 - (sq.charCodeAt(0) - 97));
  return sq;
}

/* ---------- логика кликов ---------- */

function onSquare(square) {
  const g = state.game;
  if (!g || g.status !== 'active') return;
  if (state.pending) return;
  if (!g.yourTurn) { toast('Сейчас не ваш ход'); return; }

  const piece = pieceAt(square);
  const isMine = piece && piece[0] === g.you;

  if (state.selected) {
    const moves = legalMovesFrom(state.selected).filter((m) => m.slice(2, 4) === square);
    if (moves.length) {
      const promo = moves.find((m) => m.length === 5);
      if (promo) { askPromotion(state.selected, square); return; }
      sendMove(moves[0]);
      return;
    }
    if (isMine) { state.selected = square; renderBoard(); return; }
    state.selected = null;
    renderBoard();
    return;
  }
  if (isMine) {
    state.selected = square;
    renderBoard();
  }
}

function askPromotion(from, to) {
  const box = $('promoPick');
  const options = [
    ['q', '♕ Ферзь'], ['r', '♖ Ладья'], ['b', '♗ Слон'], ['n', '♘ Конь'],
  ];
  box.innerHTML = options.map(([k, label]) =>
    `<button class="level" type="button" data-promo="${k}"><span class="name">${label}</span></button>`).join('');
  box.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('dlgPromo').close();
      sendMove(from + to + btn.dataset.promo);
    });
  });
  $('dlgPromo').showModal();
}

async function sendMove(uci) {
  const g = state.game;
  const from = uci.slice(0, 2);
  const to = uci.slice(2, 4);
  state.pending = true;
  state.selected = null;
  // Свой ход показываем сразу: фигура едет по доске, а ответ сервера только
  // подтверждает позицию — иначе ход появлялся рывком после ожидания сети.
  if (g && g.board && g.board[from]) {
    const board = { ...g.board };
    const piece = board[from];
    delete board[from];
    board[to] = uci.length === 5 ? piece[0] + uci[4].toUpperCase() : piece;
    const optimistic = {
      ...g,
      board,
      yourTurn: false,
      lastMove: from + to,
      moves: (g.moves || []).concat([from + to]),
    };
    state.localMove = from + to;
    playMoveSound(g, optimistic);
    state.game = optimistic;
    renderBoard();
    animateMove(from + to);
  }
  renderStatus();
  try {
    const updated = await api(`/api/game/${state.gameId}/move`, {
      method: 'POST',
      body: JSON.stringify({ uci }),
    });
    applyGame(updated);
    if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred('light');
  } catch (err) {
    state.localMove = null;
    toast(err.message);
    refresh();
  } finally {
    state.pending = false;
    renderStatus();
  }
}

/* ---------- состояние ---------- */

function applyGame(g) {
  const prev = state.game;
  const prevCount = prev ? (prev.moves || []).length : 0;
  const newCount = (g.moves || []).length;
  const lastMove = g.lastMove || (g.moves || [])[newCount - 1] || '';
  const own = Boolean(state.localMove) && lastMove === state.localMove;
  if (own) state.localMove = null;
  const fresh = prevCount === 0 && newCount === 0;

  if (newCount > prevCount && !own) {
    // Ход Косатки придерживаем: видно, что она думает, и ход читается
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    if (state.oppTimer) clearTimeout(state.oppTimer);
    state.oppTimer = setTimeout(() => {
      state.oppTimer = null;
      commitGame(g, { animate: true, fresh: false });
    }, OPPONENT_DELAY);
    return;
  }
  commitGame(g, { animate: newCount > prevCount, fresh });
}

function commitGame(g, { animate = false, fresh = false } = {}) {
  const prev = state.game;
  state.game = g;
  if (!state.forceFlip) {
    if (g.you) state.perspective = g.you;
    else state.perspective = state.perspective || 'w';
  }
  if (animate) state.selected = null;
  renderBoard(fresh ? 'spawn' : false);
  if (animate) {
    const move = g.lastMove || (g.moves || [])[(g.moves || []).length - 1];
    const moved = animateMove(move);
    playMoveSound(prev, g);
    if (!moved) flashLast(g);
    state.lastSeenMove = move;
  }
  renderStatus();
  renderHistory();
  renderOverlay();
  schedulePoll();
}

function playMoveSound(prev, g) {
  if (!prev || (g.moves || []).length <= (prev.moves || []).length) return;
  const move = g.lastMove || '';
  const from = move.slice(0, 2);
  const to = move.slice(2, 4);
  const wasOnTarget = prev.board && prev.board[to];
  const isCastle = prev.board && prev.board[from] && prev.board[from][1] === 'K'
    && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2;
  const pieceLetter = prev.board && prev.board[from] ? prev.board[from][1] : '';
  if (isCastle) Sound.castle();
  else if (wasOnTarget && prev.board[from] !== prev.board[to]) Sound.capture();
  else if (pieceLetter === 'P' && from[0] !== to[0] && !wasOnTarget) Sound.capture();
  else Sound.move();
  if (g.isCheck && g.status !== 'finished') setTimeout(() => Sound.check(), 220);
  if (g.status === 'finished') {
    const mine = g.you && g.result && (g.result.includes('Ничья') || ((g.result.includes('Белые') && g.you === 'w') || (g.result.includes('Чёрные') && g.you === 'b')));
    setTimeout(() => (mine ? Sound.win() : Sound.lose()), 320);
  }
}

function flashLast(g) {
  const el = document.querySelector('svg.board .lastmark');
  if (!el) return;
  el.animate([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.55 }], { duration: 700, easing: 'ease-out' });
}

function schedulePoll() {
  if (state.timer) clearTimeout(state.timer);
  const g = state.game;
  if (!g) return;
  const needPoll = g.status === 'waiting' || (g.status === 'active' && (!g.yourTurn || g.mode === 'pvp'));
  if (!needPoll) return;
  state.timer = setTimeout(refresh, POLL_MS);
}

async function refresh() {
  if (!state.gameId) return;
  try {
    const g = await api(`/api/game/${state.gameId}`);
    applyGame(g);
  } catch (err) {
    if (err.status === 404) notInGame();
  }
}

function renderStatus() {
  const g = state.game;
  if (!g) return;
  const sub = $('subtitle');
  const mood = $('mood');
  const counter = $('counter');
  let text = '';
  if (g.mode === 'pve') text = 'Косатка · ' + g.levelName;
  else text = 'Партия с другом';
  sub.textContent = text;

  mood.textContent = g.mood || '';
  let c = '';
  if (g.status === 'waiting') c = 'Отправьте другу ссылку — и он сядет за доску';
  else if (g.status === 'finished') c = g.result || 'Партия окончена';
  else if (state.pending) c = 'Косатка думает…';
  else if (!g.you) c = 'Вы смотрите партию';
  else if (g.yourTurn) c = 'Ваш ход' + (g.isCheck ? ' · шах!' : '');
  else c = 'Ходит соперник' + (g.isCheck ? ' · шах!' : '');
  counter.textContent = c;

  const canAct = Boolean(g.you) && g.status === 'active';
  $('btnResign').disabled = !canAct;
  $('btnDraw').disabled = !canAct || g.mode === 'pve';
  $('btnFlip').disabled = false;
}

function renderHistory() {
  const g = state.game;
  const box = $('history');
  if (!g) { box.textContent = ''; return; }
  const moves = g.movesSan || [];
  if (!moves.length) { box.textContent = 'Ходов пока нет — первая лапа за вами.'; return; }
  const pairs = [];
  for (let i = 0; i < moves.length; i += 2) {
    pairs.push(`${i / 2 + 1}. ${moves[i]}${moves[i + 1] ? ' ' + moves[i + 1] : ''}`);
  }
  const tail = pairs.slice(-12).join('   ');
  const mat = g.material ? ` · <span class="material">${g.material}</span>` : '';
  box.innerHTML = `<b>Ходы:</b> ${tail}${mat}`;
}

function renderOverlay() {
  const g = state.game;
  const ov = $('overlay');
  if (!g) { ov.classList.remove('show'); return; }
  if (g.status === 'finished') {
    $('overlayTitle').textContent = g.resultKind === 'draw' ? 'Ничья' : 'Партия окончена';
    $('overlayText').textContent = g.result || '';
    ov.classList.add('show');
    if (TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('success');
  } else if (g.status === 'waiting') {
    $('overlayTitle').textContent = 'Ждём друга';
    $('overlayText').textContent = 'Косатка уже села за доску и ждёт второго игрока.';
    ov.classList.add('show');
  } else {
    ov.classList.remove('show');
  }
}

function enterGame(g) {
  $('app').classList.remove('hidden');
  state.gameId = g.id;
  state.perspective = g.you || 'w';
  state.selected = null;
  $('overlay').classList.remove('show');
  applyGame(g);
  if (g.joinUrl) showJoinLink(g.joinUrl);
}

function showJoinLink(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Ссылка для друга скопирована'), () => toast(url));
  } else {
    toast(url);
  }
  const box = $('history');
  box.innerHTML = `Ссылка для друга: <b>${url}</b><br><span style="font-size:12px">Отправьте её тому, с кем хотите играть.</span>`;
}

/* ---------- кнопки ---------- */

function bindActions() {


  const soundBtn = $('btnSound');
  if (soundBtn) {
    const sync = () => { soundBtn.textContent = Sound.enabled ? '🔊' : '🔇'; };
    sync();
    soundBtn.addEventListener('click', () => {
      Sound.enabled = !Sound.enabled;
      localStorage.setItem('kosatka_sound', Sound.enabled ? '1' : '0');
      sync();
      if (Sound.enabled) Sound.click();
    });
  }
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });

  const themeBtn = $('btnTheme');
  if (themeBtn) {
    const syncTheme = () => { themeBtn.title = 'Тема: ' + THEMES[state.theme].title; };
    syncTheme();
    themeBtn.addEventListener('click', () => {
      state.theme = state.theme === 'wood' ? 'green' : 'wood';
      localStorage.setItem('kosatka_theme', state.theme);
      syncTheme();
      renderBoard();
      Sound.click();
    });
  }

  $('btnFlip').addEventListener('click', () => {
    state.forceFlip = state.perspective === 'w' ? 'b' : 'w';
    state.perspective = state.forceFlip;
    renderBoard();
  });

  $('overlayAgain').addEventListener('click', () => toast('Новую партию заведите в Telegram — через бота Косатки'));

  $('btnResign').addEventListener('click', async () => {
    if (!state.gameId) return;
    if (!confirm('Сдаться? Косатка не осуждает.')) return;
    try {
      const g = await api(`/api/game/${state.gameId}/resign`, { method: 'POST', body: '{}' });
      applyGame(g);
    } catch (err) { toast(err.message); }
  });

  $('btnDraw').addEventListener('click', async () => {
    if (!state.gameId) return;
    try {
      const g = await api(`/api/game/${state.gameId}/draw`, { method: 'POST', body: '{}' });
      applyGame(g);
      toast(g.notice || 'Предложение отправлено');
    } catch (err) { toast(err.message); }
  });

  board.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ---------- утилиты ---------- */

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- старт ---------- */

async function boot() {
  bindActions();
  renderBoard();

  if (!state.isTelegram) {
    const params = new URLSearchParams(location.search);
    const asPlayer = params.get('as') || '';
    if (asPlayer) state.name = asPlayer;
  }

  const gameParam = new URLSearchParams(location.search).get('game');
  if (gameParam) {
    try {
      enterGame(await api(`/api/game/${gameParam}`));
      return;
    } catch (err) { /* ниже предложим открыть из бота */ }
  }

  if (state.startParam) {
    try {
      const g = await api(`/api/join/${encodeURIComponent(state.startParam)}`, {
        method: 'POST',
        body: JSON.stringify({ playerName: state.name }),
      });
      enterGame(g);
      return;
    } catch (err) {
      toast('Приглашение не найдено или устарело');
    }
  }

  try {
    const last = await api('/api/last');
    if (last && last.id) {
      enterGame(last);
      return;
    }
  } catch (err) { /* партии нет */ }

  notInGame();
}

function notInGame() {
  state.gameId = null;
  state.game = null;
  if (state.timer) clearTimeout(state.timer);
  const gid = new URLSearchParams(location.search).get('game');
  if (gid) {
    api(`/api/game/${gid}`).then(enterGame).catch(() => showMessage('Партия не найдена — заведите новую в Telegram.'));
    return;
  }
  showMessage('Откройте игру из бота Косатки в Telegram: меню «Играть с Косаткой» или «Позвать друга».');
}

function showMessage(text) {
  $('overlayTitle').textContent = 'Партии пока нет';
  $('overlayText').textContent = text;
  $('overlay').classList.add('show');
  $('board').innerHTML = '';
  $('counter').textContent = '';
  renderBoard();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.gameId) refresh();
});

boot();
</script>
