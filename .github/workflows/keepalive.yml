name: keepalive

# Render free усыпляет сервис после 15 минут без HTTP-запросов.
# Telegram опрашивается поллингом, поэтому /start не будит контейнер —
# держим его тёплым пингом health каждые 10 минут.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          for attempt in 1 2 3; do
            if curl -sSf --max-time 60 https://kosatka-api.onrender.com/api/health; then
              echo ""
              echo "сервис отвечает"
              exit 0
            fi
            echo "попытка $attempt не удалась, ждём 20 с"
            sleep 20
          done
          echo "сервис не ответил"
          exit 1
